services:
  # Throwaway database; nothing is persisted and no host port is published.
  mongo:
    image: mongo:7
    # The controllers wrap every write in a transaction, which a standalone
    # mongod rejects. A single-node replica set is enough.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    tmpfs:
      - /data/db
    healthcheck:
      # Initiates the set on the first probe; healthy only once a primary has
      # been elected, so the backend cannot connect mid-election.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }) }; db.hello().isWritablePrimary || quit(1)"
      interval: 3s
      timeout: 10s
      retries: 20
      start_period: 5s
    networks:
      - test-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Source and deps are baked into the image (see backend/Dockerfile).
    environment:
      - NODE_ENV=test
      - CORS_ORIGIN=http://frontend:3000
      # The database name must contain "-test", or tests/setup.ts and the seed
      # script both refuse to run.
      - MONGODB_URI=mongodb://mongo:27017/shared-expense-app-test?replicaSet=rs0
      - JWT_SECRET=insecure-jwt-secret-for-local-tests-only-not-for-any-real-deployment
    depends_on:
      mongo:
        condition: service_healthy
    # Seed first, so e2e always runs against the known fixtures.
    command: bash -c "npm run seed && npm start"
    networks:
      - test-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - REACT_APP_API_URL=http://backend:5000
    depends_on:
      - backend
    networks:
      - test-network

  e2e-runner:
    # Must match @playwright/test in package.json, or the browsers are missing.
    image: mcr.microsoft.com/playwright:v1.58.2-jammy
    volumes:
      - .:/app
    working_dir: /app
    # Run as the host user, or the report lands in your repo owned by root.
    user: "${UID:-1000}:${GID:-1000}"
    depends_on:
      - frontend
      - backend
    environment:
      - BASE_URL=http://frontend:3000
      # npm needs a writable HOME for its cache when not running as root.
      - HOME=/tmp
    command: >
      bash -c "
        npm install &&
        npx wait-on http-get://frontend:3000 tcp:backend:5000 &&
        npx playwright test
      "
    networks:
      - test-network

networks:
  test-network:
    driver: bridge
